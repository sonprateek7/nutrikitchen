spring.application.name=nutrikitchen
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./nutrikitchen-data;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=false
server.error.include-message=never
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

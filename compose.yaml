services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nutrikitchen
      POSTGRES_USER: nutrikitchen
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrikitchen -d nutrikitchen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nutrikitchen-database:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://database:5432/nutrikitchen
      DATABASE_USERNAME: nutrikitchen
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  nutrikitchen-database:
